name: Java CI with Maven

on:
  push:

    branches: [ "main", "master", "Junit+BDD" ]
  pull_request:
    branches: [ "main", "master", "Junit+BDD" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'corretto'
        cache: maven
        
    - name: Run Tests with Maven

      run: mvn test
