name: Test-CI
on:
  push:
    branches: ["Junit+BDD"]
  workflow_dispatch: #  permite darle un botón de "Play" manual

jobs:
 automation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'corretto'
      - name: Run SauceDemo Tests
        run: mvn test
